# ════════════════════════════════════════════════════════════════════
#  ÁREAS DE INTERVENÇÃO
#  Cada área tem: o cartão da página inicial (card_title, card_text)
#  e a secção completa da página Áreas de Intervenção.
# ════════════════════════════════════════════════════════════════════
areas:
  eyebrow: "Áreas de intervenção"
  title: "Áreas de intervenção"
  intro: "A dor e as limitações físicas têm causas diferentes em cada pessoa. Nesta página descrevo as áreas em que trabalho com maior frequência, a forma como é feita a avaliação e o que pode fazer parte do plano de intervenção."
  note_title: "Nota"
  note: "A intervenção depende sempre da avaliação clínica. Perante sinais de alerta, deve procurar avaliação médica."
  labels:
    symptoms: "Sintomas e limitações associados"
    assessment: "Como é feita a avaliação"
    intervention: "O que pode incluir a intervenção"
    intervention_intro: "Consoante a avaliação, o plano pode incluir:"
    faq: "Perguntas frequentes"

  items:
    # ── 1 ──────────────────────────────────────────────────────────
    - id: "musculo-esqueletica"
      highlight: false
      card_title: "Dor na coluna e lesões músculo-esqueléticas"
      card_text: "Dor cervical, dorsal e lombar, tendinopatias e lesões desportivas, com atenção ao retorno à atividade."
      title: "Fisioterapia músculo-esquelética"
      subtitle: "Dor na coluna, tendinopatias e lesões desportivas"
      explanation: >-
        A dor cervical, dorsal ou lombar, as tendinopatias e as lesões
        associadas ao desporto ou ao trabalho estão entre os motivos mais
        frequentes de procura de fisioterapia. Podem surgir de forma súbita ou
        instalar-se aos poucos, e a sua evolução é influenciada por fatores
        como a carga, o movimento, o descanso e o contexto de cada pessoa.
      symptoms:
        - "Dor ou rigidez no pescoço, nas costas ou na região lombar"
        - "Dor que irradia para o braço ou para a perna"
        - "Dor em tendões ou articulações durante ou depois do esforço"
        - "Dificuldade em estar sentado, levantar pesos, dormir ou treinar"
        - "Receio de voltar ao exercício ou ao desporto depois de uma lesão"
      assessment: >-
        Começo por ouvir a sua história: como surgiu a queixa, como tem
        evoluído, o que a agrava e o que a alivia. Segue-se uma avaliação
        física do movimento, da força, da mobilidade e da resposta ao esforço,
        ajustada à sua situação. Se algum sinal indicar a necessidade de
        avaliação médica ou de exames complementares, recomendo essa avaliação.
      intervention:
        - "Terapia manual e técnicas osteopáticas"
        - "Exercício terapêutico, com progressão gradual da carga"
        - "Trabalho de mobilidade e de controlo neuromuscular"
        - "Educação sobre a condição e gestão da atividade diária"
        - "Planeamento do regresso ao trabalho, ao treino ou à competição"
      faq:
        - q: "Devo levar exames para a consulta?"
          a: "Se tiver exames ou relatórios médicos relacionados com a queixa, é útil trazê-los. Nem sempre são necessários exames antes de começar: se a avaliação indicar que podem ser úteis, recomendo que fale com o seu médico."
        - q: "Devo ficar em repouso enquanto tenho dor?"
          a: "Depende da situação. Em muitos casos, manter algum movimento, ajustado à tolerância, faz parte da recuperação. Noutros, é necessário reduzir temporariamente a carga. Na avaliação, defino consigo o que deve manter, adaptar ou evitar."
        - q: "De quantas sessões vou precisar?"
          a: "Não há um número igual para todos. Depende da condição, do tempo de evolução, dos seus objetivos e da forma como responde à intervenção. Depois da avaliação, explico o que é razoável esperar e vamos reavaliando ao longo do processo."
        - q: "Posso continuar a treinar?"
          a: "Sempre que possível, o objetivo é adaptar o treino em vez de o interromper. Ajustamos as cargas, os exercícios e o volume em função dos sintomas e planeamos um regresso progressivo à atividade."

    # ── 2 ── (cartão com destaque visual na página inicial) ────────
    - id: "atm"
      highlight: true
      card_title: "ATM e dor orofacial"
      card_text: "Dor mandibular, bruxismo, limitação da abertura da boca e tensão cervical associada."
      title: "ATM e dor orofacial"
      subtitle: "Dor na mandíbula, bruxismo e limitação da abertura da boca"
      explanation: >-
        A articulação temporomandibular (ATM) liga a mandíbula ao crânio e
        participa em funções como mastigar, falar e bocejar. As disfunções
        temporomandibulares podem envolver a articulação, os músculos da
        mastigação e as estruturas vizinhas, e surgem com frequência a par de
        tensão na região cervical.
      symptoms:
        - "Dor na mandíbula, na face ou junto ao ouvido"
        - "Estalidos na articulação, quando acompanhados de dor ou de limitação"
        - "Dificuldade ou desconforto ao abrir a boca, mastigar ou bocejar"
        - "Sensação de bloqueio ou de desvio da mandíbula"
        - "Apertar ou ranger os dentes (bruxismo), com tensão na face ou no pescoço"
      assessment: >-
        A avaliação inclui a história dos sintomas, os hábitos (como apertar
        os dentes), o sono e os fatores que agravam ou aliviam a queixa. No
        exame físico, observo a abertura e os movimentos da mandíbula, a
        articulação e os músculos da mastigação, bem como a coluna cervical.
        Quando se justifica, a intervenção pode ser articulada com o seu
        médico dentista ou com outros profissionais de saúde que o acompanham.
      intervention:
        - "Terapia manual dirigida à articulação, aos músculos da mastigação e à região cervical"
        - "Exercícios de mobilidade, coordenação e relaxamento da mandíbula"
        - "Educação sobre hábitos orais e sobre a posição de repouso da mandíbula"
        - "Estratégias de autocuidado para o dia a dia"
      faq:
        - q: "O bruxismo trata-se com fisioterapia?"
          a: "O bruxismo tem causas diversas. A fisioterapia não atua sobre todas elas, mas pode ajudar a gerir a dor, a tensão muscular e os hábitos associados. A necessidade de outras medidas, como uma goteira, é avaliada pelo médico dentista."
        - q: "Os estalidos na mandíbula são motivo de preocupação?"
          a: "Estalidos sem dor e sem limitação do movimento são comuns e, muitas vezes, não precisam de tratamento. Se forem acompanhados de dor, de bloqueio ou de dificuldade em abrir a boca, justifica-se uma avaliação."
        - q: "Qual é a relação entre a mandíbula e o pescoço?"
          a: "A mandíbula e a coluna cervical estão ligadas do ponto de vista muscular e neurológico, e é frequente as queixas surgirem em conjunto. Por isso, a avaliação da ATM inclui também a região cervical."
        - q: "Já uso goteira. Faz sentido fazer fisioterapia?"
          a: "Pode fazer. A goteira e a fisioterapia têm objetivos diferentes e podem complementar-se. A avaliação permite perceber se há fatores musculares, articulares ou de hábito em que valha a pena intervir."

    # ── 3 ──────────────────────────────────────────────────────────
    - id: "cefaleias-tonturas"
      highlight: false
      card_title: "Cefaleias e tonturas"
      card_text: "Quando associadas a fatores cervicais ou músculo-esqueléticos, após avaliação."
      title: "Cefaleias e tonturas"
      subtitle: "Quando há fatores cervicais ou músculo-esqueléticos associados"
      explanation: >-
        As cefaleias e as tonturas têm muitas causas possíveis, e nem todas
        são do âmbito da fisioterapia. Em alguns casos, a região cervical, os
        músculos da cabeça e do pescoço ou a articulação temporomandibular
        contribuem para os sintomas. É nesses casos, identificados através da
        avaliação, que a fisioterapia pode ter um papel.
      symptoms:
        - "Dor de cabeça acompanhada de dor ou rigidez no pescoço"
        - "Dor que começa na nuca e se estende à cabeça"
        - "Sintomas que mudam com certos movimentos ou posições mantidas do pescoço"
        - "Sensação de instabilidade ou tontura associada a queixas cervicais"
        - "Tensão na face, na mandíbula ou nos ombros"
      assessment: >-
        O primeiro passo é perceber se os sintomas são compatíveis com uma
        origem músculo-esquelética. Para isso, recolho a história clínica com
        detalhe, incluindo o padrão, a frequência e os fatores que
        desencadeiam os sintomas, e avalio a coluna cervical, a musculatura e,
        quando indicado, a ATM. Se os sintomas sugerirem outra origem, ou se
        existirem sinais de alerta, recomendo avaliação médica antes de
        qualquer intervenção.
      intervention:
        - "Terapia manual dirigida à região cervical e aos tecidos associados"
        - "Exercício específico para a mobilidade, a força e o controlo da região cervical"
        - "Educação sobre fatores desencadeantes e gestão da atividade"
        - "Articulação com o seu médico, quando necessário"
      faq:
        - q: "Todas as dores de cabeça podem ser tratadas com fisioterapia?"
          a: "Não. Há vários tipos de cefaleia, com origens diferentes. A fisioterapia pode ser útil quando existem fatores cervicais ou músculo-esqueléticos a contribuir para os sintomas, o que só é possível perceber com uma avaliação."
        - q: "As minhas tonturas vêm do pescoço?"
          a: "Podem vir ou não. As tonturas têm causas muito variadas, incluindo causas do ouvido interno, cardiovasculares ou neurológicas, que devem ser avaliadas por um médico. Quando essas causas estão esclarecidas e há queixas cervicais associadas, a fisioterapia pode fazer parte do plano."
        - q: "Quando devo procurar um médico?"
          a: "Procure avaliação médica urgente perante uma dor de cabeça súbita e muito intensa, diferente do habitual, ou acompanhada de febre, alterações da visão ou da fala, perda de força, dormência, desmaio, ou que surja depois de um traumatismo. Em caso de dúvida, a avaliação médica vem primeiro."

    # ── 4 ──────────────────────────────────────────────────────────
    - id: "dor-persistente"
      highlight: false
      card_title: "Dor persistente e recuperação funcional"
      card_text: "Limitações nas atividades diárias, educação sobre dor e autogestão."
      title: "Dor persistente e recuperação funcional"
      subtitle: "Recuperar capacidade nas atividades do dia a dia"
      explanation: >-
        Fala-se de dor persistente quando a dor se mantém para além do tempo
        habitual de recuperação, em geral mais de três meses. Nestas
        situações, a dor deixa de refletir apenas o estado de uma estrutura e
        passa a ser influenciada por vários fatores, como o sono, o stress, o
        nível de atividade e as experiências anteriores. A intervenção
        centra-se em recuperar função e em dar à pessoa ferramentas para gerir
        a sua condição.
      symptoms:
        - "Dor que se mantém ou regressa há vários meses"
        - "Dificuldade em tarefas do dia a dia, no trabalho ou no exercício"
        - "Cansaço, sono pouco reparador ou menor tolerância ao esforço"
        - "Receio de que o movimento agrave a dor"
        - "Perda de confiança no corpo e redução progressiva da atividade"
      assessment: >-
        A avaliação procura compreender o percurso da dor, o impacto que tem
        na sua vida e aquilo que é importante para si recuperar. Além do exame
        físico, falamos sobre rotinas, sono, atividade e tratamentos
        anteriores, para identificar os fatores que podem estar a contribuir
        para a manutenção dos sintomas.
      intervention:
        - "Educação sobre a dor e sobre os fatores que a influenciam"
        - "Exercício terapêutico, com exposição gradual ao movimento e à atividade"
        - "Terapia manual, quando adequada, integrada num plano ativo"
        - "Definição de objetivos funcionais e de estratégias de autogestão"
      faq:
        - q: "Se os exames não mostram nada, porque é que tenho dor?"
          a: "A dor é real mesmo quando os exames não mostram alterações. Os exames mostram estruturas, mas a dor depende também da forma como o sistema nervoso processa a informação e de fatores como o sono, o stress e a atividade. Compreender isto faz parte do processo de recuperação."
        - q: "O movimento pode agravar a minha dor?"
          a: "Sentir algum desconforto ao retomar o movimento é comum e não significa, por si só, que haja lesão. O plano é construído de forma gradual, respeitando a sua tolerância, para que possa voltar a mover-se com confiança."
        - q: "A dor vai desaparecer por completo?"
          a: "Não é possível garantir. Em muitas pessoas a dor diminui; noutras, o ganho principal está em recuperar atividades, autonomia e qualidade de vida. Os objetivos são definidos consigo e revistos ao longo do acompanhamento."
        - q: "O que significa autogestão?"
          a: "Significa ter conhecimento e estratégias para lidar com a condição no dia a dia: saber dosear a atividade, reconhecer o que agrava e o que ajuda, e manter um plano de exercício adaptado. O objetivo é ganhar autonomia."


