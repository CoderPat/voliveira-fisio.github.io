#  ABORDAGEM CLÍNICA
# ════════════════════════════════════════════════════════════════════
approach:
  eyebrow: "Abordagem clínica"
  title: "Uma abordagem individualizada, centrada na pessoa."
  intro: "Cada pessoa tem uma história, necessidades e objetivos próprios. A intervenção começa por compreender esses fatores e a forma como se relacionam com a condição atual."
  steps_title: "Quatro etapas"
  steps:
    - title: "Escuta e avaliação"
      text: "Começo por conhecer a sua história clínica, os sintomas, as limitações e os objetivos. Segue-se uma avaliação física adequada à sua situação."
    - title: "Compreensão da condição"
      text: "Procuro identificar os fatores que podem contribuir para os sintomas e as funções que precisam de atenção, e explico-lhe o que encontrei de forma clara."
    - title: "Plano de intervenção"
      text: "O plano pode combinar terapia manual, técnicas osteopáticas, exercício terapêutico, trabalho de mobilidade e de controlo neuromuscular, e educação sobre dor e movimento."
    - title: "Acompanhamento e evolução"
      text: "Ao longo do processo, reavalio, ajusto o plano e acompanho a forma como responde à intervenção."
  osteopathic:
    title: "Técnicas osteopáticas"
    paragraphs:
      - "As técnicas osteopáticas são técnicas manuais que podem incluir abordagens articulares, miofasciais, cranianas e viscerais."
      - "Utilizo-as quando são clinicamente adequadas, como complemento da intervenção e sempre integradas no raciocínio clínico que resulta da avaliação. A escolha depende de cada pessoa e de cada situação."
  closing: "O objetivo é ajudar cada pessoa a recuperar capacidade, autonomia e confiança no movimento."
  first_visit:
    title: "Primeira consulta: o que esperar"
    duration_label: "Duração"
    price_label: "Valor"
    bring_label: "O que levar"
    bring:
      - "Roupa confortável, que permita mover-se à vontade"
      - "Exames e relatórios médicos relacionados com a queixa, se os tiver"
      - "Indicação da medicação que toma habitualmente"
    how_label: "Como decorre"
