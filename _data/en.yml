# ════════════════════════════════════════════════════════════════════
#  ÁREAS DE INTERVENÇÃO
# ════════════════════════════════════════════════════════════════════
areas:
  eyebrow: "Areas of care"
  title: "Areas of care"
  intro: "Pain and physical limitations have different causes in each person. On this page I describe the areas I work with most often, how the assessment is carried out and what a plan of care may include."
  note_title: "Please note"
  note: "Any intervention always depends on the clinical assessment. If you have warning signs, you should seek medical evaluation."
  labels:
    symptoms: "Associated symptoms and limitations"
    assessment: "How the assessment works"
    intervention: "What the intervention may include"
    intervention_intro: "Depending on the assessment, the plan may include:"
    faq: "Frequently asked questions"

  items:
    # ── 1 ──────────────────────────────────────────────────────────
    - id: "musculoskeletal"
      highlight: false
      card_title: "Spinal pain and musculoskeletal injuries"
      card_text: "Neck, mid-back and low back pain, tendinopathies and sports injuries, with a focus on returning to activity."
      title: "Musculoskeletal physiotherapy"
      subtitle: "Spinal pain, tendinopathies and sports injuries"
      explanation: >-
        Neck, mid-back and low back pain, tendinopathies and injuries related
        to sport or work are among the most common reasons people seek
        physiotherapy. They can appear suddenly or build up gradually, and
        how they progress is influenced by factors such as load, movement,
        rest and each person's circumstances.
      symptoms:
        - "Pain or stiffness in the neck, back or lower back"
        - "Pain that radiates into the arm or leg"
        - "Tendon or joint pain during or after exertion"
        - "Difficulty sitting, lifting, sleeping or training"
        - "Fear of returning to exercise or sport after an injury"
      assessment: >-
        I start by listening to your story: how the problem began, how it has
        progressed, what makes it worse and what eases it. This is followed by
        a physical assessment of movement, strength, mobility and response to
        load, adapted to your situation. If anything suggests the need for a
        medical evaluation or further tests, I will recommend it.
      intervention:
        - "Manual therapy and osteopathic techniques"
        - "Therapeutic exercise, with gradual progression of load"
        - "Mobility and neuromuscular control work"
        - "Education about the condition and managing daily activity"
        - "Planning the return to work, training or competition"
      faq:
        - q: "Should I bring test results to the appointment?"
          a: "If you have scans or medical reports related to the problem, it is helpful to bring them. Tests are not always needed before starting: if the assessment suggests they could be useful, I will recommend that you speak to your doctor."
        - q: "Should I rest while I am in pain?"
          a: "It depends on the situation. In many cases, keeping some movement going, within what you can tolerate, is part of recovery. In others, load needs to be reduced for a while. During the assessment we work out together what to keep, adapt or avoid."
        - q: "How many sessions will I need?"
          a: "There is no number that applies to everyone. It depends on the condition, how long you have had it, your goals and how you respond to the intervention. After the assessment I explain what is reasonable to expect, and we reassess along the way."
        - q: "Can I keep training?"
          a: "Whenever possible, the aim is to adapt your training rather than stop it. We adjust loads, exercises and volume according to your symptoms and plan a gradual return to activity."

    # ── 2 ── (cartão com destaque visual na página inicial) ────────
    - id: "tmj"
      highlight: true
      card_title: "TMJ and orofacial pain"
      card_text: "Jaw pain, bruxism, limited mouth opening and associated neck tension."
      title: "TMJ and orofacial pain"
      subtitle: "Jaw pain, bruxism and limited mouth opening"
      explanation: >-
        The temporomandibular joint (TMJ) connects the jaw to the skull and is
        involved in chewing, speaking and yawning. Temporomandibular disorders
        can involve the joint, the chewing muscles and neighbouring
        structures, and often appear alongside tension in the neck.
      symptoms:
        - "Pain in the jaw, the face or near the ear"
        - "Clicking in the joint, when accompanied by pain or restriction"
        - "Difficulty or discomfort when opening the mouth, chewing or yawning"
        - "A feeling that the jaw locks or deviates"
        - "Clenching or grinding the teeth (bruxism), with tension in the face or neck"
      assessment: >-
        The assessment covers the history of your symptoms, habits (such as
        clenching), sleep and whatever makes the problem better or worse. In
        the physical examination I look at how the jaw opens and moves, the
        joint and the chewing muscles, as well as the cervical spine. Where
        appropriate, care can be coordinated with your dentist or with other
        health professionals involved in your care.
      intervention:
        - "Manual therapy for the joint, the chewing muscles and the neck"
        - "Jaw mobility, coordination and relaxation exercises"
        - "Education about oral habits and the resting position of the jaw"
        - "Self-care strategies for everyday life"
      faq:
        - q: "Can bruxism be treated with physiotherapy?"
          a: "Bruxism has a range of causes. Physiotherapy does not act on all of them, but it can help you manage the pain, muscle tension and habits that come with it. Whether other measures are needed, such as an occlusal splint, is for your dentist to assess."
        - q: "Is a clicking jaw something to worry about?"
          a: "Clicking without pain and without restricted movement is common and often needs no treatment. If it comes with pain, locking or difficulty opening the mouth, an assessment is worthwhile."
        - q: "How are the jaw and the neck related?"
          a: "The jaw and the cervical spine are linked through muscles and nerves, and problems in the two areas often appear together. That is why a TMJ assessment also includes the neck."
        - q: "I already wear a splint. Is physiotherapy still worth considering?"
          a: "It can be. A splint and physiotherapy have different aims and can complement each other. The assessment shows whether there are muscular, joint or habit-related factors worth working on."

    # ── 3 ──────────────────────────────────────────────────────────
    - id: "headaches-dizziness"
      highlight: false
      card_title: "Headaches and dizziness"
      card_text: "When linked to cervical or musculoskeletal factors, following assessment."
      title: "Headaches and dizziness"
      subtitle: "When cervical or musculoskeletal factors are involved"
      explanation: >-
        Headaches and dizziness have many possible causes, and not all of them
        fall within the scope of physiotherapy. In some cases the neck, the
        muscles of the head and neck or the temporomandibular joint contribute
        to the symptoms. It is in those cases, identified through assessment,
        that physiotherapy may have a role.
      symptoms:
        - "Headache accompanied by neck pain or stiffness"
        - "Pain that starts at the back of the neck and spreads to the head"
        - "Symptoms that change with certain neck movements or sustained positions"
        - "A feeling of unsteadiness or dizziness associated with neck problems"
        - "Tension in the face, jaw or shoulders"
      assessment: >-
        The first step is to establish whether the symptoms are consistent
        with a musculoskeletal origin. To do that, I take a detailed clinical
        history, including the pattern, frequency and triggers of your
        symptoms, and assess the cervical spine, the muscles and, where
        indicated, the TMJ. If the symptoms point to another origin, or if
        there are warning signs, I will recommend a medical evaluation before
        any intervention.
      intervention:
        - "Manual therapy for the neck and associated tissues"
        - "Specific exercise for neck mobility, strength and control"
        - "Education about triggers and activity management"
        - "Coordination with your doctor, when needed"
      faq:
        - q: "Can all headaches be treated with physiotherapy?"
          a: "No. There are several types of headache, with different origins. Physiotherapy may be useful when cervical or musculoskeletal factors are contributing to the symptoms, which can only be established through an assessment."
        - q: "Is my dizziness coming from my neck?"
          a: "It may or may not be. Dizziness has a wide range of causes, including inner ear, cardiovascular and neurological causes, which should be assessed by a doctor. Once those have been clarified and there are associated neck problems, physiotherapy may be part of the plan."
        - q: "When should I see a doctor?"
          a: "Seek urgent medical attention for a sudden, very severe headache that is different from usual, or one that comes with fever, changes in vision or speech, loss of strength, numbness or fainting, or that follows an injury. If in doubt, medical evaluation comes first."

    # ── 4 ──────────────────────────────────────────────────────────
    - id: "persistent-pain"
      highlight: false
      card_title: "Persistent pain and functional recovery"
      card_text: "Limitations in daily activities, pain education and self-management."
      title: "Persistent pain and functional recovery"
      subtitle: "Regaining capacity in everyday activities"
      explanation: >-
        Pain is described as persistent when it continues beyond the usual
        recovery time, generally more than three months. In these situations,
        pain no longer reflects only the state of one structure and becomes
        influenced by several factors, such as sleep, stress, activity levels
        and previous experiences. The intervention focuses on restoring
        function and giving the person tools to manage their condition.
      symptoms:
        - "Pain that has persisted or kept returning for several months"
        - "Difficulty with everyday tasks, work or exercise"
        - "Fatigue, unrefreshing sleep or lower tolerance to effort"
        - "Fear that movement will make the pain worse"
        - "Loss of confidence in the body and a gradual reduction in activity"
      assessment: >-
        The assessment aims to understand the course of your pain, the impact
        it has on your life and what matters most to you to get back. Beyond
        the physical examination, we talk about routines, sleep, activity and
        previous treatments, to identify the factors that may be helping to
        maintain the symptoms.
      intervention:
        - "Education about pain and the factors that influence it"
        - "Therapeutic exercise, with gradual exposure to movement and activity"
        - "Manual therapy, where appropriate, as part of an active plan"
        - "Setting functional goals and self-management strategies"
      faq:
        - q: "If my scans show nothing, why am I in pain?"
          a: "Pain is real even when scans show no changes. Scans show structures, but pain also depends on how the nervous system processes information and on factors such as sleep, stress and activity. Understanding this is part of the recovery process."
        - q: "Can movement make my pain worse?"
          a: "Feeling some discomfort when you start moving again is common and does not, in itself, mean there is damage. The plan is built up gradually, within what you can tolerate, so that you can move with confidence again."
        - q: "Will the pain go away completely?"
          a: "That cannot be guaranteed. For many people the pain decreases; for others, the main gain is getting back activities, independence and quality of life. Goals are set together with you and reviewed throughout your care."
        - q: "What does self-management mean?"
          a: "It means having the knowledge and strategies to deal with your condition day to day: knowing how to pace activity, recognising what makes things worse and what helps, and keeping up an adapted exercise plan. The aim is greater independence."


