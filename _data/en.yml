#  ABORDAGEM CLÍNICA
# ════════════════════════════════════════════════════════════════════
approach:
  eyebrow: "Clinical approach"
  title: "An individualised, person-centred approach."
  intro: "Every person has their own story, needs and goals. Care begins with understanding those factors and how they relate to the current condition."
  steps_title: "Four stages"
  steps:
    - title: "Listening and assessment"
      text: "I start by getting to know your clinical history, symptoms, limitations and goals. This is followed by a physical assessment suited to your situation."
    - title: "Understanding the condition"
      text: "I look for the factors that may be contributing to your symptoms and the functions that need attention, and explain clearly what I have found."
    - title: "Plan of care"
      text: "The plan may combine manual therapy, osteopathic techniques, therapeutic exercise, mobility and neuromuscular control work, and education about pain and movement."
    - title: "Follow-up and progress"
      text: "Throughout the process I reassess, adjust the plan and follow how you respond to the intervention."
  osteopathic:
    title: "Osteopathic techniques"
    paragraphs:
      - "Osteopathic techniques are manual techniques that can include articular, myofascial, cranial and visceral approaches."
      - "I use them when they are clinically appropriate, as a complement to the intervention and always as part of the clinical reasoning that follows from the assessment. The choice depends on each person and each situation."
  closing: "The aim is to help each person regain capacity, independence and confidence in movement."
  first_visit:
    title: "Your first appointment: what to expect"
    duration_label: "Duration"
    price_label: "Fee"
    bring_label: "What to bring"
    bring:
      - "Comfortable clothing that lets you move freely"
      - "Scans and medical reports related to the problem, if you have them"
      - "A note of any medication you take regularly"
    how_label: "How it works"
    how: "The appointment starts with a conversation about your clinical history, symptoms and goals, followed by the physical assessment. At the end I explain what I have found, answer your questions and propose a plan."
  button: "Book an assessment"


